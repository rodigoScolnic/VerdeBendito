databases:
  - name: verdebendito-db
    databaseName: verdebendito
    user: verdebendito
    plan: free

services:
  - type: web
    name: verdebendito
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: verdebendito-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
